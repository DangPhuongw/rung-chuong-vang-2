services:
  - type: web
    name: quiz-battle-royale
    env: node
    plan: free
    buildCommand: npm install && npm run render:build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        value: "file:./dev.db"
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
